[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
zeron-proto = { path = "crates/proto" }
zeron-doc = { path = "crates/doc" }
zeron-sync = { path = "crates/sync" }
zeron-harness = { path = "crates/harness" }
zeron-engine = { path = "crates/engine" }
zeron-rpc = { path = "crates/rpc" }

# CRDT
loro = "1.13"

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "7"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0

# Keep dependencies optimized in dev builds (loro, rusqlite, crypto).
[profile.dev.package."*"]
opt-level = 2
