[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/ui",
    "crates/syntax",
    "apps/zeron",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
zeron-proto = { path = "crates/proto" }
zeron-doc = { path = "crates/doc" }
zeron-sync = { path = "crates/sync" }
zeron-harness = { path = "crates/harness" }
zeron-engine = { path = "crates/engine" }
zeron-rpc = { path = "crates/rpc" }
zeron-ui = { path = "crates/ui" }
zeron-syntax = { path = "crates/syntax" }

# CRDT
loro = "1.13"

# gpui — balnoumair/zed fork (`comet-gpui-patches`): latest upstream zed main +
# wingleeio's comet patches (EdgeFade, BackdropBlur, macOS 26 blur, atlas
# evict, wrap punctuation, GPU memory bounds). Rev 1340cd9b — see
# https://github.com/balnoumair/zed/tree/comet-gpui-patches
gpui = { git = "https://github.com/balnoumair/zed", rev = "1340cd9b90dfcd1068f07248ef4164a320717ff2" }
gpui_platform = { git = "https://github.com/balnoumair/zed", rev = "1340cd9b90dfcd1068f07248ef4164a320717ff2", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/balnoumair/zed", rev = "1340cd9b90dfcd1068f07248ef4164a320717ff2" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator for the binaries: returns freed pages to the OS. System
# malloc (macOS libmalloc especially) retains the churn high-water mark as
# permanent RSS - measured as the top residency cause in docs/memory-plan.md.
mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
