name: release

# Build release artifacts and publish them as a GitHub Release.
# This fork is local-only: there is no R2 upload, edge deployment, or hosted
# updater step here.
#
# A release is created only for a version tag such as v0.1.0. Manual runs build
# artifacts for inspection without publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Package DMG
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/package/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$(find dist -maxdepth 1 -type f -name "zeron-${version}-*")" \
            || { echo "tag v${version} does not match any built artifact"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
